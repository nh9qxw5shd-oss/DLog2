# Diagnostic only: does nrsdb.uk's bot protection admit GitHub-hosted runners?
# Reports the HTTP status of the login page and the ESR data route. 401 on the
# data route means "reachable, just not logged in"; 403 means blocked at the
# edge. Run manually from the Actions tab (workflow_dispatch). No secrets used.
name: NRSDB reachability probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nrsdb-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe nrsdb.uk from a GitHub-hosted runner
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"
          echo "runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          for path in "/login.php" "/ajax/get.php?r=getEsrsByRouteCode&routecode=EM&filter=imposed"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 -A "$UA" \
              -H "Accept: application/json, text/javascript, */*; q=0.01" -H "X-Requested-With: XMLHttpRequest" \
              -D /tmp/headers "https://nrsdb.uk$path" || echo "curl-failed")
            sp=$(grep -i '^x-stackprotect-id' /tmp/headers | tr -d '\r' || true)
            echo "GET $path -> HTTP $code  bytes=$(wc -c < /tmp/body)  ${sp:+[$sp]}"
          done
          echo "VERDICT: data route 401 = admitted (session path viable from GitHub); 403 = blocked."
